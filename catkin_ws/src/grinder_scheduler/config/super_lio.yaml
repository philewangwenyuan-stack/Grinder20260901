# Super-LIO is the only supported map backend. The mode manager owns mapping
# and relocation roslaunch processes; the scheduler only calls its services.
localization_backend: super_lio
super_lio_map_root: /home/neardi/work/Grinder/maps
# 进程和服务超时（秒）
# ---------------------------------------------------------------------------
super_lio_service_timeout_sec: 30.0        # 调用 Super-LIO 服务（如保存地图、重定位）的最长等待时间
super_lio_startup_timeout_sec: 60.0        # launch 启动后等待节点就绪、健康检查通过的最长时间，超时判定启动失败
super_lio_shutdown_timeout_sec: 8.0        # 正常停止（SIGINT）后等待进程退出的时间，超时进入强制清理
super_lio_cleanup_timeout_sec: 4.0         # 强制清理阶段（SIGTERM/SIGKILL、残留节点）的最长等待时间
# ---------------------------------------------------------------------------
# 数据流健康检查
# ---------------------------------------------------------------------------
super_lio_health_window_sec: 1.0           # 统计话题频率的滑动窗口长度
super_lio_message_max_age_sec: 0.5         # 点云/IMU/里程计最新一条消息超过这个时间没更新，就判定为过期
super_lio_map_max_age_sec: 5.0             # 地图话题允许的最大过期时间（地图发布频率低，所以放得宽一些）
super_lio_min_lidar_hz: 5.0                # 点云最低频率（MID360 标称 10 Hz）
super_lio_min_imu_hz: 20.0                 # IMU 最低频率（MID360 内置 IMU 标称约 200 Hz，这里只用来判断"断流"）
super_lio_min_odom_hz: 5.0                 # LIO 里程计输出的最低频率
# ---------------------------------------------------------------------------
# 定位状态判定（用连续帧计数做滞回，避免状态来回跳）
# ---------------------------------------------------------------------------
super_lio_localization_stable_frames: 5    # 连续 5 帧质量合格，才判定"定位成功/稳定"
super_lio_localization_bad_frames: 15      # 连续 15 帧质量不合格，才判定"定位丢失"

# 单帧匹配质量门限（任何一项不满足，这一帧就算"坏帧"）
super_lio_fitness_max_m2: 0.3              # 配准残差（均方距离）上限，单位 m²
super_lio_inlier_ratio_min: 0.2            # 内点比例下限（有效匹配点占比）
super_lio_min_correspondences: 100         # 有效对应点数量下限，太少说明观测退化
# 位姿协方差门限
super_lio_max_xy_variance: 0.25            # xy 位置方差上限（m²），对应标准差 0.5 m
super_lio_max_yaw_variance: 0.06853892     # 航向方差上限（rad²），对应标准差 0.2618 rad ≈ 15°
# 位姿跳变门限（两次定位输出之间）
super_lio_max_pose_jump_m: 0.75            # 平移跳变上限，单位 m
super_lio_max_yaw_jump_rad: 0.52359878     # 航向跳变上限，0.5236 rad = 30°

super_lio_tf_base_frame: base_link         # 输出位姿/TF 用的机体坐标系

# ---------------------------------------------------------------------------
# Add fixed ports owned by managed Super-LIO nodes here. The unique Livox
# startup script checks the external driver's configured host UDP ports.
super_lio_preflight_ports: []
super_lio_loop_closure: false              # 回环检测，默认关闭
super_lio_autosave: false                  # 自动保存地图，默认关闭（由服务调用显式保存）

# Optional internal wheel observations. Enable only after replay/calibration.
super_lio_wheel_fusion_mapping_enabled: false        # 建图模式下是否融合轮速
super_lio_wheel_fusion_localization_enabled: true    # 定位模式下是否融合轮速
super_lio_wheel_fuse_linear_velocity: true           # 融合轮速线速度（打开总开关后才生效）
super_lio_wheel_fuse_angular_velocity: true          # 不融合轮速角速度（IMU 陀螺仪更准，轮速角速度受打滑影响大）
super_lio_wheel_twist_topic: /chassis/wheel_twist    # 轮速输入话题
super_lio_wheel_max_age_sec: 0.25                    # 轮速消息超过这个时间就丢弃，不参与融合

# NIS（归一化新息平方）卡方门限，用来剔除打滑、异常的轮速观测
super_lio_wheel_single_nis_gate: 9.0       # 单维观测门限：1 自由度卡方，约等于 3σ
super_lio_wheel_joint_nis_gate: 11.83      # 二维联合观测门限：2 自由度卡方，99.73% 置信度（等效 3σ）
