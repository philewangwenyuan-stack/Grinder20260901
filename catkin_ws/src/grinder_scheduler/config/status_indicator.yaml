# Enable the launch explicitly. Mock never opens a physical USB device.
backend: mock
# Bench only: skip chassis heartbeat and allow explicit scheduler reset without chassis confirmation.
# Driver motion latch remains protected; restore false before hardware operation.
ignore_chassis_status: true
usb_serial_number: ""
device: ""
brightness_percent: 65      # 1..100 (%); restart the indicator node after editing.
state_timeout_sec: 3.0
send_interval_sec: 0.5
