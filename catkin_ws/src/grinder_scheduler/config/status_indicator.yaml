# Enable the launch explicitly. Mock never opens a physical USB device.
backend: mock
# Bench test only: skip chassis status/heartbeat requirements; retain received emergency alerts.
ignore_chassis_status: true
usb_serial_number: ""
device: ""
brightness: 102             # 0..255 scale, enforced maximum 102 (40%)
state_timeout_sec: 3.0
send_interval_sec: 0.5
