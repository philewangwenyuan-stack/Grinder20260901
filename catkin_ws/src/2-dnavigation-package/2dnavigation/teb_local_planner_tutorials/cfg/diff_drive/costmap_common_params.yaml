
#---standard pioneer footprint---
#---(in meters)---

# robot_radius: 0.17
# footprint_padding: 0.00
robot_radius: 0.0
footprint_padding: 0.00
footprint: [[-0.6, 0.47], [1.00, 0.47], [1.00, -0.47], [-0.6, -0.47]]


transform_tolerance: 0.2
map_type: costmap

always_send_full_costmap: true

obstacle_layer:
 enabled: true
 obstacle_range: 3.0
 raytrace_range: 4.0
 inflation_radius: 0.2
 track_unknown_space: true
 combination_method: 1

 observation_sources: laser_scan_sensor
 laser_scan_sensor: {data_type: LaserScan, topic: scan, marking: true, clearing: true, inf_is_valid: true}


inflation_layer:
  enabled:              true
  cost_scaling_factor:  10.0  # exponential rate at which the obstacle cost drops off (default: 10)
  inflation_radius:     0.1 # max. distance from an obstacle at which costs are incurred for planning paths.

static_layer:
  enabled:              true
  map_topic:            "/map"

#---standard pioneer footprint---
#---(in meters)---

# robot_radius: 0.17
# footprint_padding: 0.00
robot_radius: 0.0
footprint_padding: 0.00
footprint: [[-0.6, 0.47], [1.00, 0.47], [1.00, -0.47], [-0.6, -0.47]]


transform_tolerance: 0.2
map_type: costmap

always_send_full_costmap: true

obstacle_layer:
  enabled: true
  # STVL driven by the real-time /scan (LaserScan), NOT the VSLAM map cloud
  # voxel_decay makes residuals that cannot be raytrace-cleared expire by time
  voxel_decay: 0.4         # seconds; voxel cleared if not re-observed
  decay_model: 0            # 0 = linear decay
  voxel_size: 0.1
  track_unknown_space: true
  mark_threshold: 0
  update_footprint_enabled: true
  combination_method: 1
  origin_z: 0.0
  publish_voxel_map: false
  transform_tolerance: 0.3
  mapping_mode: false
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    inf_is_valid: true
    obstacle_range: 3.0
    min_obstacle_height: 0.0
    max_obstacle_height: 2.0
    clear_after_reading: true
    expected_update_rate: 0.0

inflation_layer:
  enabled:              true
  cost_scaling_factor:  5.0  # exponential rate at which the obstacle cost drops off (default: 10)
  inflation_radius:     0.6 # max. distance from an obstacle at which costs are incurred for planning paths.

static_layer:
  enabled:              true
  map_topic:            "/map"
