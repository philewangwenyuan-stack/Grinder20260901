RegulatedPurePursuitController:
  # 低速角速度补偿：仅在 0.015 <= |v| < 0.10 m/s 且曲率满足原有滞回条件时生效。
  # 触发死区应与底盘 cmd_vel_filter_angular_deadband 一致；0 表示关闭补偿。
  low_speed_angular_deadband: 0.025  # 仅对低于该值的小角速度申请补偿，单位：rad/s
  # 补偿输出幅值，单位：rad/s；必须 >= 上述死区，否则不补偿；不是实测物理启动门槛。
  # 当前按底盘软件死区设为 0.025，不额外抬至旧值 0.050；轮速量化后能否转动需实测。
  # 两项可通过 dynamic_reconfigure 调整；旧行为可显式设为 0.045 / 0.050。
  low_speed_min_angular_vel: 0.025
  desired_linear_vel: 0.3
  lookahead_dist: 0.5
  min_lookahead_dist: 0.3
  max_lookahead_dist: 0.7
  lookahead_time: 1.5
  rotate_to_heading_angular_vel: 0.3
  use_command_angular_velocity_for_accel_limit: true
  transform_tolerance: 0.1
  use_velocity_scaled_lookahead_dist: false
  min_approach_linear_velocity: 0.05
  use_approach_velocity_scaling: true
  approach_velocity_scaling_dist: 0.6
  use_collision_detection: true
  use_fixed_distance_collision_detection: true
  use_footprint_expansion_collision_detection: false
  collision_front_clearance_m: 0.5
  collision_side_clearance_m: 0.15
  collision_side_only_when_turning: true
  collision_side_turning_min_angular_vel: 0.005
  collision_stop_distance_m: 0.5
  collision_scan_half_angle_rad: 0.35
  max_allowed_time_to_collision_up_to_carrot: 1.0
  use_regulated_linear_velocity_scaling: true
  use_fixed_curvature_lookahead: false
  curvature_lookahead_dist: 0.25
  use_cost_regulated_linear_velocity_scaling: true
  regulated_linear_scaling_min_radius: 0.9
  regulated_linear_scaling_min_speed: 0.25
  use_rotate_to_heading: true
  allow_reversing: false
  rotate_to_heading_min_angle: 0.5
  rotate_to_heading_exit_angle: 0.05
  rotate_to_heading_stable_cycles: 5
  use_corner_aware_rotate_to_heading: true
  rotate_to_heading_corner_distance: 0.08
  max_angular_accel: 0.3
  max_linear_accel: 2.0
  use_command_velocity_for_accel_limit: true
  max_robot_pose_search_dist: 10.0
  preserve_plan_progress_on_update: true
  plan_update_equivalence_tolerance_m: 0.02
  use_global_plan_search_fallback: true
  theta_stopped_vel: 1.0
  trans_stopped_vel: 0.02
  goal_dist_tol: 0.03
  angle_tol: 0.03
  max_linear_vel: 0.3
  max_angular_vel: 0.3
  cost_scaling_dist: 0.5
  cost_scaling_gain: 1.0
  inflation_cost_scaling_factor: 3.0
  interpolate_curvature_after_goal: false
  k: 6.0
  min_turning_radius: 0.2
  use_vector_pure_pursuit: false
