# 并行测试：不发布 TF，不影响现有 Aurora 主定位
frequency: 20
sensor_timeout: 0.35
two_d_mode: true
publish_tf: false
print_diagnostics: true

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom

# Aurora：融合 x、y、yaw；不融合其 twist（twist covariance 目前为零）
odom0: /odom
odom0_config: [true,  true,  false,
               false, false, true,
               false, false, false,
               false, false, false,
               false, false, false]
odom0_differential: false
odom0_relative: false
odom0_queue_size: 10

# RF2O：只融合前进速度 vx 和角速度 yaw_rate
odom1: /odom_rf2o
odom1_config: [false, false, false,
               false, false, false,
               true,  false, false,
               false, false, true,
               false, false, false]
odom1_differential: false
odom1_relative: false
odom1_queue_size: 10
